name: watch

on:
  schedule:
    # every 6 hours; GitHub runs scheduled jobs on UTC
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      check_only:
        description: "Only report drift, do not write"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install formatter
        run: npm ci --no-audit --no-fund

      - name: Probe upstream
        id: probe
        run: |
          set -o pipefail
          node watch.mjs ${{ inputs.check_only && '--check' || '' }} | tee /tmp/report.json
          echo "dirty=$(node -e 'const r=require("/tmp/report.json");process.stdout.write(String(!!(r.wrote||r.newSlugs?.length||r.changedItems?.length)))')" >> "$GITHUB_OUTPUT"

      - name: Commit drift
        if: ${{ !inputs.check_only }}
        run: |
          git config user.name "affectui-watcher"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain)" ]; then
            echo "no drift, nothing to commit"
            exit 0
          fi
          bundle=$(node -e 'const r=require("/tmp/report.json");process.stdout.write(r.bundleAfter||"unknown")')
          git add -A
          git commit -m "chore: sync upstream (${bundle})"
          git push

      - name: Summary
        if: always()
        run: |
          {
            echo "### affectUI upstream probe"
            echo '```json'
            cat /tmp/report.json 2>/dev/null || echo "no report"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

